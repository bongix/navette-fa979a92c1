<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Navette Scolaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-css">
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  color-scheme:light;
  --bg:#EBEFF3; --surface:#FFFFFF; --surface-2:#F5F8FA; --sunken:#E3E9EE;
  --ink:#101820; --ink-2:#53616E; --ink-3:#8896A3;
  --line:#DCE3E9; --line-strong:#BEC9D3;
  --accent:#1B4A6B;
  --p0:#B03A2C; --p1:#2A5F8F; --p2:#2C7A55; --p3:#93670F; --p4:#664A93;
  --p-on:#FFFFFF;
  --vacant:#C4562C;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 8px 20px -14px rgba(16,24,32,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F141A; --surface:#171E25; --surface-2:#1C242C; --sunken:#12181E;
    --ink:#E9EEF3; --ink-2:#A2B0BD; --ink-3:#6E7C89;
    --line:#28323B; --line-strong:#3B4854;
    --accent:#88B8D8;
    --p0:#E87762; --p1:#77ABDA; --p2:#5FBB8B; --p3:#D6AB4E; --p4:#AA8FD4;
    --p-on:#12181E;
    --vacant:#E08A5E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F141A; --surface:#171E25; --surface-2:#1C242C; --sunken:#12181E;
  --ink:#E9EEF3; --ink-2:#A2B0BD; --ink-3:#6E7C89;
  --line:#28323B; --line-strong:#3B4854;
  --accent:#88B8D8;
  --p0:#E87762; --p1:#77ABDA; --p2:#5FBB8B; --p3:#D6AB4E; --p4:#AA8FD4;
  --p-on:#12181E;
  --vacant:#E08A5E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -16px rgba(0,0,0,.8);
}

body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;   /* pas de gonflement du texte en paysage sur iOS */
}
button,select,input{touch-action:manipulation}   /* supprime le délai de tap sur Android */
#root{max-width:1180px;margin:0 auto;padding:36px 22px 72px;display:flex;flex-direction:column;gap:26px}

h1,h2,h3{font-family:Archivo,"IBM Plex Sans",sans-serif;text-wrap:balance;line-height:1.15}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- header ---------- */
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;
  padding-bottom:20px;border-bottom:2px solid var(--ink)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.masthead h1{font-size:clamp(28px,4.4vw,44px);font-weight:700;letter-spacing:-.02em;margin-top:6px}
.masthead .week{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);margin-top:8px;letter-spacing:.01em}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.status.live .dot{background:var(--p2)}
.status.ro .dot{background:var(--p3)}

.notice{background:var(--surface-2);
  border:1px solid var(--line);border-left:3px solid var(--vacant);border-radius:3px;padding:14px 18px;font-size:13.5px;color:var(--ink-2)}
.notice strong{color:var(--ink);font-weight:600}
.notice .hd{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--vacant)}
.notice ul{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:6px}
.notice li{padding-left:16px;position:relative;line-height:1.5}
.notice li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;
  border:1.5px solid var(--vacant)}
.notice.lecture{border-left-color:var(--accent)}
.notice.lecture .hd{color:var(--accent)}
.notice.lecture p{margin-top:7px;line-height:1.55;max-width:74ch}

/* ---------- roster ---------- */
.roster{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.roster .lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.tag{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:5px 12px 5px 8px;font-size:13px;font-weight:500}
.swatch{width:11px;height:11px;border-radius:3px;background:var(--pc);flex:none}
.tag .of{font-size:11.5px;color:var(--ink-3)}
.tag .of::before{content:"· "}
.tag .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  border-left:1px solid var(--line);padding-left:8px;margin-left:1px}
.tag.tbd{border-style:dashed;border-color:var(--line-strong)}
.tag.tbd .who{font-style:italic;color:var(--ink-2)}
.tag.tbd .swatch{opacity:.55}

/* ---------- week grid ---------- */
.week-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden}
.day-head{padding:12px 14px 11px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.day-head .nm{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.day-head .dt{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.legs{display:flex;flex-direction:column}
.leg{padding:13px 14px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line)}
.leg:first-child{border-top:none}
.leg.vacant{background:linear-gradient(180deg,color-mix(in srgb,var(--vacant) 7%,transparent),transparent)}
.leg.todo{gap:4px;background:repeating-linear-gradient(135deg,var(--sunken),var(--sunken) 6px,transparent 6px,transparent 12px)}
.leg.todo .time{font-size:14px;color:var(--ink-3)}
.leg.todo .place{font-size:12px;color:var(--ink-3);font-style:italic}
.leg-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.time{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.way{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.way::before{content:"→ ";font-weight:400}
.way.retour::before{content:"← "}
.place{font-size:12.5px;color:var(--ink-2);line-height:1.35}

/* champs modifiables d'un trajet */
input.time-edit{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:3px;
  padding:1px 2px;width:auto;min-width:0}
input.time-edit::-webkit-calendar-picker-indicator{display:none}
input.time-edit:hover{border-color:var(--line-strong)}
select.sens-edit{font-family:inherit;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 3px;
  appearance:none;-webkit-appearance:none;cursor:pointer}
select.sens-edit:hover{border-color:var(--line-strong);color:var(--ink-2)}
.arrow{color:var(--ink-3);font-size:11px}
.arrow.aller::before{content:"→"}
.arrow.retour::before{content:"←"}
input.lieu-edit{font-family:inherit;font-size:12.5px;color:var(--ink-2);line-height:1.35;width:100%;
  background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 4px;margin-left:-4px}
input.lieu-edit:hover{border-color:var(--line-strong)}
input.time-edit:focus,select.sens-edit:focus,input.lieu-edit:focus{border-color:var(--accent);background:var(--surface);color:var(--ink)}
.leg-del{margin-left:auto;font-size:15px;line-height:1;color:var(--line-strong);background:none;border:none;
  cursor:pointer;padding:0 2px}
.leg-del:hover{color:var(--vacant)}

.confirm-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--vacant);
  background:color-mix(in srgb,var(--vacant) 10%,transparent);border-radius:3px;padding:7px 9px}
.confirm-bar button{font-family:inherit;font-size:12px;font-weight:600;border-radius:3px;padding:2px 9px;cursor:pointer;
  border:1px solid var(--vacant);background:var(--vacant);color:var(--surface)}
.confirm-bar button.no{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}

.add-leg{font-family:inherit;font-size:12px;font-weight:500;color:var(--ink-3);background:none;cursor:pointer;
  border:none;border-top:1px dashed var(--line-strong);padding:11px 14px;text-align:left;width:100%;
  transition:color .15s ease,background .15s ease}
.add-leg:hover{color:var(--accent);background:var(--surface-2)}
.kids{display:flex;flex-wrap:wrap;gap:5px}
.kid{font-size:11.5px;font-weight:500;color:var(--ink-2);background:var(--sunken);
  border-radius:3px;padding:2px 7px;border:1px solid transparent;font-family:inherit;line-height:1.45}
button.kid{cursor:pointer;transition:opacity .15s ease,color .15s ease}
button.kid:hover{color:var(--ink)}
.kid.off{background:transparent;border:1px dashed var(--line-strong);color:var(--ink-3);
  text-decoration:line-through;text-decoration-thickness:1px;opacity:.75}
.kid.off:hover{color:var(--ink-2);opacity:1}

.leg.off,.leg.off.via,.leg.off.vacant{background:none}
.leg.off .time,.leg.off .place,.leg.off .way{color:var(--ink-3);opacity:.65}
.leg.off .time{text-decoration:line-through}
.sansenfant{font-size:11.5px;font-weight:500;color:var(--ink-3);font-style:italic}

/* ---------- relais gare ---------- */
.leg.via{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,transparent),transparent)}
.leg.via.vacant{background:linear-gradient(180deg,color-mix(in srgb,var(--vacant) 7%,transparent),transparent)}
.relais{border-left:2px solid color-mix(in srgb,var(--accent) 55%,transparent);
  padding-left:10px;display:flex;flex-direction:column;gap:5px;margin-top:-2px}
.relais-hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.badge{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:3px;padding:2px 6px;white-space:nowrap}
.relais .mode{font-size:11.5px;color:var(--ink-2);line-height:1.35}
.relais-pickup{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.relais-pickup .lbl2{white-space:nowrap}
input.relais-time,.relais-time.static{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:3px;padding:2px 6px;line-height:1.3}
.relais-time.static{border-style:dashed;color:var(--ink-2)}
.relais-off{font-size:15px;line-height:1;color:var(--ink-3);background:none;border:none;cursor:pointer;
  padding:0 2px;margin-left:auto}
.relais-off:hover{color:var(--vacant)}
.relais-add{align-self:flex-start;font-family:inherit;font-size:11.5px;font-weight:500;color:var(--ink-3);
  background:none;border:1px dashed var(--line-strong);border-radius:999px;padding:3px 10px;cursor:pointer;
  transition:color .15s ease,border-color .15s ease}
.relais-add:hover{color:var(--accent);border-color:var(--accent)}

.driver{position:relative;display:inline-flex;align-self:flex-start;max-width:100%}
.driver::after{content:"";position:absolute;right:10px;top:50%;margin-top:-2px;pointer-events:none;
  border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4.5px solid var(--p-on);opacity:.75}
.driver.vacant::after{border-top-color:var(--vacant)}
.driver select,.driver .static{
  appearance:none;-webkit-appearance:none;font-family:"IBM Plex Sans",sans-serif;font-size:13px;font-weight:600;
  border-radius:999px;padding:6px 26px 6px 12px;border:1px solid transparent;
  background:var(--pc);color:var(--p-on);cursor:pointer;max-width:100%;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.driver .static{cursor:default;padding-right:12px}
.driver.vacant select,.driver.vacant .static{background:transparent;color:var(--vacant);
  border:1px dashed var(--vacant);font-weight:600}
.driver select:disabled{cursor:default;opacity:1}
.driver.static-only::after{display:none}

/* ---------- balance ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);padding:22px 24px}
.panel h2{font-size:15px;font-weight:600;letter-spacing:.03em}
.panel .sub{font-size:13px;color:var(--ink-2);margin-top:4px;max-width:62ch}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.bar-row{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:12px}
.bar-row .who{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;background:var(--sunken);border-radius:2px;overflow:hidden}
.fill{height:100%;background:var(--pc);border-radius:2px;transition:width .35s ease}
.bar-row .num{font-family:"IBM Plex Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.bar-row.open .who{color:var(--vacant);font-weight:600}
.bar-row.open .fill{background:repeating-linear-gradient(45deg,var(--vacant),var(--vacant) 3px,transparent 3px,transparent 6px)}

/* ---------- guide ---------- */
.guide table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
.guide th{text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--line)}
.guide td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
.guide td:first-child{font-family:"IBM Plex Mono",monospace;color:var(--ink);white-space:nowrap;font-size:12.5px}
.guide .scroll{overflow-x:auto}
.foot{font-size:12.5px;color:var(--ink-3);text-align:center;padding-top:4px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;
  transition:opacity .2s ease,transform .2s ease;z-index:50;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Écrans tactiles : cibles confortables au doigt, et 16px minimum sur tout champ
   de saisie — en dessous, Safari iOS zoome automatiquement à la mise au point. */
@media (pointer:coarse){
  button.kid{padding:8px 12px;font-size:13px}
  .driver select,.driver .static{padding:11px 30px 11px 15px;font-size:16px}
  .driver::after{right:13px}
  input.time-edit{padding:8px 7px;font-size:17px;border-color:var(--line)}
  select.sens-edit{padding:9px 7px;font-size:16px;letter-spacing:.06em;border-color:var(--line)}
  input.lieu-edit{padding:9px 7px;font-size:16px;border-color:var(--line)}
  .leg-del{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    font-size:22px;padding:0}
  .relais-add{padding:10px 15px;font-size:13.5px}
  .relais-off{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;
    font-size:20px;padding:0}
  input.relais-time{padding:9px 11px;font-size:16px}
  .relais-pickup{font-size:13px}
  .confirm-bar{font-size:13.5px;padding:10px}
  .confirm-bar button{padding:9px 18px;font-size:14px}
  .add-leg{padding:16px 14px;font-size:13.5px}
  .leg{gap:11px}
}

@media (max-width:1040px){.week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){
  #root{padding:26px 15px 56px;gap:20px}
  .week-grid{grid-template-columns:1fr}
  /* sur un écran étroit le bandeau d'état doit pouvoir passer à la ligne */
  .status{white-space:normal;max-width:100%;align-items:flex-start}
  .status .dot{margin-top:7px}
  .bar-row{grid-template-columns:88px 1fr 30px}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}
  .status,#toast,.notice{display:none}
  .day,.panel{box-shadow:none;break-inside:avoid}
  .week-grid{grid-template-columns:repeat(5,1fr)}
  .driver::after{display:none}
}
</style>
</head>

teur": null, "relais": null}, {"jour": "mar", "sens": "aller", "heure": "08:00", "lieu": "SPC — début des cours", "enfants": ["selena", "emrys", "hugo"], "conducteur": null}, {"jour": "mar", "sens": "retour", "heure": "17:00", "lieu": "SPC → maisons", "enfants": ["selena", "emrys", "hugo"], "conducteur": null, "relais": null}, {"jour": "mer", "sens": "aller", "heure": "08:00", "lieu": "SPC — début des cours", "enfants": ["selena", "emrys", "hugo"], "conducteur": null}, {"jour": "mer", "sens": "retour", "heure": "12:00", "lieu": "SPC → maisons", "enfants": ["selena", "emrys", "hugo"], "conducteur": null, "relais": null}, {"jour": "jeu", "sens": "aller", "heure": "08:00", "lieu": "SPC — début des cours", "enfants": ["selena", "emrys", "hugo"], "conducteur": null}, {"jour": "jeu", "sens": "retour", "heure": "17:00", "lieu": "SPC → maisons", "enfants": ["selena", "emrys", "hugo"], "conducteur": null, "relais": null}, {"jour": "ven", "sens": "aller", "heure": "08:00", "lieu": "SPC — début des cours", "enfants": ["selena", "emrys", "hugo"], "conducteur": null}, {"jour": "ven", "sens": "retour", "heure": "17:00", "lieu": "SPC → maisons", "enfants": ["selena", "emrys", "hugo"], "conducteur": null, "relais": null}], "majLe": "1 septembre 2026"}</script>

<script id="app-js">
(function(){
  "use strict";

  var TITLE = "Navette Scolaire";
  var FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com">'
            + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
            + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">';

  var state = JSON.parse(document.getElementById("app-state").textContent);
  // dernière version connue comme publiée, pour revenir en arrière si l'écriture est refusée
  var dernierEnregistre = document.getElementById("app-state").textContent;
  var api = null;        // artifact capability namespace, once resolved
  var editable = false;  // becomes true when the capability is available
  // true quand la page tourne hors de Claude (fichier local, Drive) : aucun partage possible
  var horsLigne = !(window.claude && typeof window.claude.use === "function");
  var busy = false;      // un envoi est en cours
  var pending = false;   // une modification est arrivée pendant cet envoi
  var pendingDelete = null;  // index du trajet dont la suppression attend confirmation
  var focusNew = null;       // index du trajet qui vient d'être ajouté, à mettre au focus

  // lieux proposés par défaut, un par sens
  var LIEU = { aller: "SPC — début des cours", retour: "SPC → maisons" };

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function parentById(id){
    for (var i = 0; i < state.parents.length; i++) if (state.parents[i].id === id) return state.parents[i];
    return null;
  }
  function parentColor(id){
    for (var i = 0; i < state.parents.length; i++) if (state.parents[i].id === id) return "var(--p" + (i % 5) + ")";
    return "var(--ink-3)";
  }
  function childName(id){
    for (var i = 0; i < state.enfants.length; i++) if (state.enfants[i].id === id) return state.enfants[i].nom;
    return id;
  }
  // prénom seul, pour les endroits où le nom complet serait redondant
  function childShort(id){ return childName(id).split(" ")[0]; }
  function legsFor(dayId){
    return state.trajets.filter(function(t){ return t.jour === dayId; })
      .sort(function(a, b){ return a.heure < b.heure ? -1 : a.heure > b.heure ? 1 : 0; });
  }
  // un trajet vidé de ses enfants n'a pas lieu : il ne compte nulle part
  function actifs(){
    return state.trajets.filter(function(t){ return t.enfants.length > 0; });
  }
  function vacantCount(){
    return actifs().filter(function(t){ return !t.conducteur; }).length;
  }
  function chargeDe(pid){
    return actifs().filter(function(t){ return t.conducteur === pid; }).length;
  }

  /* ---------------- render ---------------- */

  function headerHTML(){
    var v = vacantCount();
    var cls = editable ? "status live" : "status ro";
    var msg = editable
      ? "Vous modifiez — tout le monde voit vos changements"
      : (horsLigne
          // copie statique : la date de mise à jour dit si le planning est encore d'actualité
          ? (state.majLe ? "Mis à jour le " + state.majLe + " — lecture seule"
                         : "Copie hors ligne — planning figé")
          : "Planning tenu à jour par l’organisateur");
    return ''
      + '<header class="masthead">'
      +   '<div>'
      +     '<div class="eyebrow">SPC — '
      +       esc(state.enfants.map(function(e){ return e.nom.split(" ")[0]; }).join(", "))
      +       ' · ' + state.parents.length + ' parents</div>'
      +     '<h1>' + esc(TITLE) + '</h1>'
      +     '<div class="week">' + esc(state.semaine) + ' · ' + actifs().length + ' trajets · '
      +       (v ? v + ' sans conducteur' : 'tout est couvert') + '</div>'
      +   '</div>'
      +   '<div class="' + cls + '"><span class="dot"></span>' + esc(msg) + '</div>'
      + '</header>';
  }

  function noticeHTML(){
    // les consignes de modification n'ont de sens que pour la personne qui peut modifier
    if (!editable){
      return state.noteLecteur
        ? '<div class="notice lecture"><div class="hd">Bon à savoir</div><p>' + state.noteLecteur + '</p></div>'
        : '';
    }
    var items = state.aCompleter || [];
    if (!items.length) return '';
    return '<div class="notice"><div class="hd">Pense-bête</div><ul>'
      + items.map(function(t){ return '<li>' + t + '</li>'; }).join('')
      + '</ul></div>';
  }

  function rosterHTML(){
    var out = '<div class="roster"><span class="lbl">Conducteurs</span>';
    state.parents.forEach(function(p){
      var n = chargeDe(p.id);
      out += '<span class="tag' + (p.provisoire ? ' tbd' : '') + '" style="--pc:' + parentColor(p.id) + '">'
           + '<span class="swatch"></span><span class="who">' + esc(p.nom) + '</span>'
           + (p.enfant ? '<span class="of">' + esc(childShort(p.enfant)) + '</span>' : '')
           + '<span class="n">' + n + '</span></span>';
    });
    out += '</div>';
    return out;
  }

  function driverHTML(idx, t){
    var vac = !t.conducteur;
    var color = vac ? "transparent" : parentColor(t.conducteur);
    var label = vac ? "À pourvoir" : parentById(t.conducteur).nom;
    var wrap = 'class="driver' + (vac ? ' vacant' : '') + (editable ? '' : ' static-only') + '" style="--pc:' + color + '"';

    if (!editable){
      return '<span ' + wrap + '><span class="static">' + esc(label) + '</span></span>';
    }
    var opts = '<option value=""' + (vac ? ' selected' : '') + '>À pourvoir</option>';
    state.parents.forEach(function(p){
      opts += '<option value="' + esc(p.id) + '"' + (p.id === t.conducteur ? ' selected' : '') + '>' + esc(p.nom) + '</option>';
    });
    return '<span ' + wrap + '><select data-leg="' + idx + '" aria-label="Conducteur du trajet de '
         + esc(t.heure) + '">' + opts + '</select></span>';
  }

  function relaisHTML(idx, t){
    if (t.sens !== "retour") return '';
    var gare = state.relaisLieu || "la gare";

    if (!t.relais){
      if (!editable) return '';
      return '<button type="button" class="relais-add" data-relais-on="' + idx + '">'
           + '+ Relais ' + esc(gare) + '</button>';
    }
    var arr = t.relais.arrivee || "";
    var champ = editable
      ? '<input type="time" class="relais-time" data-relais-time="' + idx + '" value="' + esc(arr) + '">'
      : '<span class="relais-time static">' + esc(arr || "--:--") + '</span>';
    return '<div class="relais">'
      + '<div class="relais-hd"><span class="badge">Relais</span>'
      + (editable ? '<button type="button" class="relais-off" data-relais-off="' + idx
                  + '" title="Retirer le relais" aria-label="Retirer le relais">×</button>' : '')
      + '</div>'
      + '<div class="mode">Bus ou train jusqu’à ' + esc(gare) + ', puis récupération sur place.</div>'
      + '<div class="relais-pickup"><span class="lbl2">Récupération à</span>' + champ + '</div>'
      + '</div>';
  }

  function kidsHTML(idx, t){
    var chips = state.enfants.map(function(e){
      var on = t.enfants.indexOf(e.id) !== -1;
      if (!editable) return on ? '<span class="kid">' + esc(e.nom) + '</span>' : '';
      return '<button type="button" class="kid' + (on ? '' : ' off') + '" aria-pressed="' + on
           + '" data-kid="' + idx + '|' + esc(e.id) + '">' + esc(e.nom) + '</button>';
    }).join('');
    return chips ? '<div class="kids">' + chips + '</div>' : '';
  }

  function legHTML(t){
    var idx = state.trajets.indexOf(t);
    var actif = t.enfants.length > 0;
    var via = t.sens === "retour" && t.relais;
    var lieu = via ? "SPC → " + (state.relaisLieu || "la gare") : t.lieu;
    var cls = "leg" + (actif && !t.conducteur ? " vacant" : "") + (via ? " via" : "") + (actif ? "" : " off");

    var haut, place;
    if (editable){
      haut = '<input type="time" class="time-edit" data-heure="' + idx + '" value="' + esc(t.heure)
           + '" aria-label="Heure du trajet">'
           + '<span class="arrow ' + esc(t.sens) + '"></span>'
           + '<select class="sens-edit" data-sens="' + idx + '" aria-label="Sens du trajet">'
           +   '<option value="aller"' + (t.sens === "aller" ? " selected" : "") + '>aller</option>'
           +   '<option value="retour"' + (t.sens === "retour" ? " selected" : "") + '>retour</option>'
           + '</select>'
           + '<button type="button" class="leg-del" data-del="' + idx + '" title="Supprimer ce trajet" '
           + 'aria-label="Supprimer ce trajet">×</button>';
      place = via
        ? '<div class="place">' + esc(lieu) + '</div>'
        : '<input type="text" class="lieu-edit" data-lieu="' + idx + '" value="' + esc(t.lieu)
          + '" aria-label="Lieu du trajet">';
    } else {
      haut = '<span class="time">' + esc(t.heure) + '</span>'
           + '<span class="way ' + esc(t.sens) + '">' + esc(t.sens) + '</span>';
      place = '<div class="place">' + esc(lieu) + '</div>';
    }

    var confirmer = pendingDelete === idx
      ? '<div class="confirm-bar">Supprimer ce trajet&nbsp;?'
        + '<button type="button" data-del-yes="' + idx + '">Oui</button>'
        + '<button type="button" class="no" data-del-no="1">Non</button></div>'
      : '';

    return '<div class="' + cls + '">'
      + '<div class="leg-top">' + haut + '</div>'
      + place
      + confirmer
      + kidsHTML(idx, t)
      + (actif ? relaisHTML(idx, t) + driverHTML(idx, t)
               : '<span class="sansenfant">Aucun enfant — ce trajet n’a pas lieu</span>')
      + '</div>';
  }

  function gridHTML(){
    var out = '<div class="week-grid">';
    state.jours.forEach(function(j){
      var legs = legsFor(j.id);
      var body = legs.map(legHTML).join('');
      if (!legs.some(function(t){ return t.sens === "retour"; })){
        body += '<div class="leg todo"><div class="leg-top"><span class="time">--:--</span>'
              + '<span class="way retour">retour</span></div>'
              + '<div class="place">Horaire de sortie à renseigner</div></div>';
      }
      out += '<section class="day"><div class="day-head">'
           + '<span class="nm">' + esc(j.nom) + '</span><span class="dt">' + esc(j.date) + '</span></div>'
           + '<div class="legs">' + body + '</div>'
           + (editable ? '<button type="button" class="add-leg" data-add="' + esc(j.id) + '">'
                       + '+ Ajouter un trajet le ' + esc(j.nom.toLowerCase()) + '</button>' : '')
           + '</section>';
    });
    return out + '</div>';
  }

  function balanceHTML(){
    var counts = state.parents.map(function(p){
      return { nom: p.nom, color: parentColor(p.id),
               n: chargeDe(p.id) };
    });
    var v = vacantCount();
    var max = Math.max(1, v, counts.reduce(function(m, c){ return Math.max(m, c.n); }, 0));
    var rows = counts.map(function(c){
      return '<div class="bar-row"><span class="who">' + esc(c.nom) + '</span>'
           + '<span class="track"><span class="fill" style="--pc:' + c.color + ';width:' + (c.n / max * 100) + '%"></span></span>'
           + '<span class="num">' + c.n + '</span></div>';
    }).join('');
    if (v) {
      rows += '<div class="bar-row open"><span class="who">À pourvoir</span>'
            + '<span class="track"><span class="fill" style="width:' + (v / max * 100) + '%"></span></span>'
            + '<span class="num">' + v + '</span></div>';
    }
    var total = actifs().length, np = state.parents.length;
    var part = total % np === 0
      ? '<strong>' + (total / np) + ' trajets par parent</strong>'
      : 'environ <strong>' + Math.round(total / np) + ' trajets par parent</strong>';
    return '<section class="panel"><h2>Équilibre de la semaine</h2>'
      + '<p class="sub">' + total + ' trajets à se partager entre ' + np + ' conducteurs, soit ' + part
      + ' pour une semaine équitable. Les créneaux hachurés n’ont pas encore de conducteur.</p>'
      + '<div class="bars">' + rows + '</div></section>';
  }

  function guideHTML(){
    var rows = [
      ["jour", "Lundi → Vendredi. Un identifiant court&nbsp;: lun, mar, mer, jeu, ven."],
      ["sens", "aller ou retour. Détermine la flèche affichée."],
      ["heure", "Format 24 h, HH:MM. Sert aussi à trier les trajets dans la journée."],
      ["lieu", "Point de dépose ou de ramassage, en clair (« Gymnase → maisons »)."],
      ["enfants", "Les enfants concernés par ce trajet, séparés par des virgules. Vide&nbsp;: le trajet n’a pas lieu et ne compte pour personne."],
      ["conducteur", "Le parent, ou vide si le créneau reste à pourvoir."],
      ["relais", "Vide pour un trajet direct. Sur un retour, l’heure d’arrivée à " + esc(state.relaisLieu || "la gare")
        + " quand les enfants y vont en bus ou en train et sont récupérés sur place."]
    ].map(function(r){ return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');
    return '<section class="panel guide"><h2>Comment remplir la semaine</h2>'
      + '<p class="sub">Une ligne par trajet, sept colonnes. C’est le seul format à tenir&nbsp;: un tableur, '
      + 'un fichier CSV ou même une liste écrite à la main suffisent, et cette page se génère à partir de là.</p>'
      + '<div class="scroll"><table><thead><tr><th>Colonne</th><th>Contenu</th></tr></thead><tbody>'
      + rows + '</tbody></table></div></section>';
  }

  function render(){
    document.getElementById("root").innerHTML =
      headerHTML() + noticeHTML() + rosterHTML() + gridHTML() + balanceHTML()
      + (editable ? guideHTML() : '')
      + '<p class="foot">' + (editable
          ? 'Chaque modification est enregistrée et diffusée aussitôt&nbsp;: il n’y a rien à valider.'
          : 'Page mise à jour en direct — il suffit de la recharger pour voir la dernière version.')
      + '</p>';

    Array.prototype.forEach.call(document.querySelectorAll("select[data-leg]"), function(sel){
      sel.addEventListener("change", function(){
        var i = parseInt(sel.getAttribute("data-leg"), 10);
        state.trajets[i].conducteur = sel.value || null;
        render();
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-heure]"), function(inp){
      inp.addEventListener("change", function(){
        if (!inp.value) { inp.value = state.trajets[parseInt(inp.getAttribute("data-heure"), 10)].heure; return; }
        state.trajets[parseInt(inp.getAttribute("data-heure"), 10)].heure = inp.value;
        render();   // l'ordre chronologique de la journée peut changer
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-lieu]"), function(inp){
      inp.addEventListener("change", function(){
        state.trajets[parseInt(inp.getAttribute("data-lieu"), 10)].lieu = inp.value.trim() || "SPC";
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-sens]"), function(sel){
      sel.addEventListener("change", function(){
        var t = state.trajets[parseInt(sel.getAttribute("data-sens"), 10)];
        // le lieu suit le sens tant qu'il est resté celui proposé par défaut
        if (t.lieu === LIEU[t.sens]) t.lieu = LIEU[sel.value];
        t.sens = sel.value;
        if (t.sens === "aller") t.relais = null;   // le relais gare ne concerne que les retours
        render();
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function(b){
      b.addEventListener("click", function(){
        pendingDelete = parseInt(b.getAttribute("data-del"), 10);
        render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del-no]"), function(b){
      b.addEventListener("click", function(){ pendingDelete = null; render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del-yes]"), function(b){
      b.addEventListener("click", function(){
        state.trajets.splice(parseInt(b.getAttribute("data-del-yes"), 10), 1);
        pendingDelete = null;
        render();
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-add]"), function(b){
      b.addEventListener("click", function(){
        state.trajets.push({
          jour: b.getAttribute("data-add"),
          sens: "retour",
          heure: "17:00",
          lieu: LIEU.retour,
          enfants: state.enfants.map(function(e){ return e.id; }),
          conducteur: null,
          relais: null
        });
        focusNew = state.trajets.length - 1;
        render();
        save();
      });
    });

    if (focusNew !== null){
      var champ = document.querySelector('[data-heure="' + focusNew + '"]');
      focusNew = null;
      if (champ) { champ.focus(); champ.select && champ.select(); }
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-kid]"), function(b){
      b.addEventListener("click", function(){
        var parts = b.getAttribute("data-kid").split("|");
        var t = state.trajets[parseInt(parts[0], 10)], cid = parts[1];
        var dedans = t.enfants.indexOf(cid) !== -1;
        // on reconstruit dans l'ordre de référence pour que l'affichage reste stable
        t.enfants = state.enfants.map(function(e){ return e.id; }).filter(function(id){
          return id === cid ? !dedans : t.enfants.indexOf(id) !== -1;
        });
        render();
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-relais-on]"), function(b){
      b.addEventListener("click", function(){
        state.trajets[parseInt(b.getAttribute("data-relais-on"), 10)].relais = { arrivee: null };
        render();
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-relais-off]"), function(b){
      b.addEventListener("click", function(){
        state.trajets[parseInt(b.getAttribute("data-relais-off"), 10)].relais = null;
        render();
        save();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-relais-time]"), function(inp){
      inp.addEventListener("change", function(){
        var t = state.trajets[parseInt(inp.getAttribute("data-relais-time"), 10)];
        if (t.relais) t.relais.arrivee = inp.value || null;
        save();
      });
    });
  }

  /* ---------------- persistence ---------------- */

  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove("on"); }, 2600);
  }

  function buildDocument(s){
    var css = document.getElementById("app-css").textContent;
    var js  = document.getElementById("app-js").textContent;
    var json = JSON.stringify(s).replace(/</g, "\\u003c");
    return '<!doctype html>\n<html lang="fr">\n<head>\n'
      + '<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      + '<title>' + TITLE + '</title>\n'
      + FONTS + '\n'
      + '<style id="app-css">' + css + '</style>\n'
      + '</head>\n<body>\n'
      + '<div id="root"></div>\n'
      + '<div id="toast" role="status" aria-live="polite"></div>\n'
      + '<script type="application/json" id="app-state">' + json + '<\/script>\n'
      + '<script id="app-js">' + js + '<\/script>\n'
      + '</body>\n</html>';
  }

  function save(){
    if (!api) return;
    if (busy) { pending = true; return; }   // une modification arrivée pendant l'envoi précédent
    busy = true;
    var envoye = JSON.stringify(state);
    api.publish(buildDocument(state)).then(function(){
      busy = false;
      dernierEnregistre = envoye;
      if (pending) { pending = false; save(); return; }
      toast("Enregistré pour tout le monde");
    }, function(err){
      busy = false;
      pending = false;
      var code = err && err.code;
      if (code === "conflict") return;   // une autre vue a publié avant : tout le monde recharge sur la sienne
      if (code === "not_granted" || code === "not_writer"){
        // lecteur sans droit d'écriture : on annule sa modification pour ne pas afficher
        // un planning que personne d'autre ne voit
        state = JSON.parse(dernierEnregistre);
        editable = false;
        pendingDelete = null;
        render();
        toast("Cette page est en lecture seule");
        return;
      }
      toast("Enregistrement impossible");
    });
  }

  render();

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(ns){
      if (!ns) return;
      api = ns;
      editable = true;
      render();
    }, function(){ /* stays read-only */ });
  }
})();
</script>

</body>
</html>
